<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHECK POINT - خدمات الألعاب والتهكير</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #030712;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }
        .banner-container {
            position: relative;
            width: 100%;
            max-width: 1200px;
            background: linear-gradient(135deg, #050b18, #0a1628);
            border: 3px solid #00d4ff;
            border-radius: 15px;
            box-shadow: 0 0 25px rgba(0, 212, 255, 0.4);
            padding: 20px;
            overflow: hidden;
        }
        /* Top Header */
        .top-header {
            text-align: center;
            border-bottom: 2px solid rgba(0, 212, 255, 0.3);
            padding-bottom: 15px;
            margin-bottom: 15px;
        }
        .store-title {
            font-size: 38px;
            font-weight: 900;
            background: linear-gradient(to bottom, #ffffff 30%, #00d4ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 15px rgba(0, 212, 255, 0.5);
            letter-spacing: 2px;
        }
        .subtitle {
            color: #fbbf24;
            font-size: 16px;
            margin-top: 5px;
            font-weight: bold;
        }
        /* Main Content Grid */
        .content-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        .card {
            background: rgba(10, 22, 40, 0.85);
            border: 2px solid #0077ff;
            border-radius: 12px;
            padding: 18px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }
        .card h3 {
            color: #00d4ff;
            font-size: 20px;
            margin-bottom: 10px;
        }
        .card p {
            font-size: 15px;
            color: #dcdcdc;
            line-height: 1.5;
        }
        /* Consoles List */
        .consoles-list {
            display: flex;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 12px;
        }
        .console-badge {
            background: #1e293b;
            border: 1px solid #38bdf8;
            color: #38bdf8;
            padding: 5px 12px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 13px;
        }
        /* Single Action Button Section */
        .button-section {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }
        .action-btn {
            background: linear-gradient(135deg, #0066ff, #00d4ff);
            color: white;
            padding: 15px 40px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            text-decoration: none;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 102, 255, 0.4);
            transition: 0.3s;
            display: inline-block;
            width: 100%;
            max-width: 400px;
        }
        .action-btn:hover {
            background: linear-gradient(135deg, #0052cc, #00b4d8);
            transform: translateY(-2px);
        }
        /* Footer Info */
        .footer-banner {
            background: #030712;
            border-top: 2px dashed #00d4ff;
            padding-top: 15px;
            text-align: center;
        }
        .brand-footer {
            font-size: 22px;
            font-weight: bold;
            color: #ffffff;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }
        .phones {
            color: #00d4ff;
            font-size: 16px;
            font-weight: bold;
            direction: ltr;
            margin-bottom: 5px;
        }
        .location {
            color: #fbbf24;
            font-size: 15px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="banner-container">
        <!-- رأس الصفحة -->
        <div class="top-header">
            <div class="store-title">CHECK POINT</div>
            <div class="subtitle">تنزيل جميع ألعاب الحاسبة | خدمات ألعاب ستيم أونلاينين</div>
        </div>

        <!-- محتوى الخدمات والأجهزة -->
        <div class="content-grid">
            <div class="card">
                <h3>🎮 تهكير وتنزيل الألعاب</h3>
                <p>تهكير جميع الأجهزة وتنزيل ألعاب بلي 4 وبلي 5</p>
                <div class="consoles-list">
                    <span class="console-badge">PS4</span>
                    <span class="console-badge">PS3</span>
                    <span class="console-badge">PS2</span>
                    <span class="console-badge">PC</span>
                    <span class="console-badge">PS5</span>
                </div>
            </div>
            <div class="card">
                <h3>🌐 ألعاب ستيم أونلاين</h3>
       
            </div>
        </div>
