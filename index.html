<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHECK POINT - خدمات الألعاب والتهكير</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #030712;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
        }
        .banner-container {
            width: 100%;
            max-width: 1200px;
            text-align: center;
            padding: 10px;
        }
        .banner-link {
            display: block;
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.4);
            border: 2px solid #00d4ff;
            transition: transform 0.3s ease;
        }
        .banner-link:hover {
            transform: scale(1.01);
        }
        .banner-image {
            width: 100%;
            height: auto;
            display: block;
        }
    </style>
</head>
<body>

    <div class="banner-container">
        <!-- عند الضغط على الصورة، سيتم تحويل الزر إلى الرابط المطلوب -->
        <a href="https://raw13g.github.io" target="_blank" class="banner-link">
            <img src="background.jpg" alt="CHECK POINT" class="banner-image">
        </a>
    </div>

</body>
</html>
