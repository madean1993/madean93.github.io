<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHECK POINT - البانر النهائي</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #030712;
            display: flex;

            height: auto;
            display: block;

<body>

    <div class="banner-frame">
        <!-- قم بتسمية صورتك المعدلة باسم checkpoint_banner.jpg ورضعها في نفس المجلد -->
