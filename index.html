<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مكتب الأصدقاء - خدمات الألعاب والتهكير</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #0b0f19;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
            min-height: 100vh;
        }
        .header-container {
            width: 100%;
            max-width: 1000px;
            text-align: center;
            margin-bottom: 20px;
        }
        .banner-img {
            width: 100%;
            height: auto;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.6);
            display: block;
        }
        .section-title {
            font-size: 20px;
            margin: 20px 0 15px 0;
            color: #00d4ff;
            text-align: center;
        }
        .systems-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
            width: 100%;
            max-width: 1000px;
        }
        .btn {
            background: linear-gradient(135deg, #0072ff, #00d4ff);
            color: white;
            padding: 16px 20px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            text-decoration: none;
            text-align: center;
            display: block;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            transition: transform 0.2s, background 0.2s;
        }
        .btn:hover {
            background: linear-gradient(135deg, #0056cc, #00b4d8);
        }
        .btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <!-- قسم صورة البانر (مكتب الأصدقاء - الدواسة عمارة القدس) -->
    <div class="header-container">
        <img src="background.JPG" alt="مكتب الأصدقاء - الدواسة عمارة القدس" class="banner-img">
    </div>

    <!-- عنوان قسم اختيار الإصدارات -->
    <h2 class="section-title">اختر الإصدار المطلوب للتهكير:</h2>

    <!-- جميع الأزرار مرتبطة الآن بموقع راو -->
    <div class="systems-grid">
        <a href="https://raw13g.github.io" class="btn">⚡ تهكير نظام 9.00</a>
        <a href="https://raw13g.github.io" class="btn">⚡ تهكير نظام 10.00</a>
        <a href="https://raw13g.github.io" class="btn">⚡ تهكير نظام 11.00</a>
        <a href="https://raw13g.github.io" class="btn">⚡ تهكير نظام 12.00</a>
        <a href="https://raw13g.github.io" class="btn">⚡ تهكير نظام 13.00</a>
        <a href="https://raw13g.github.io" class="btn">⚡ تهكير نظام 13.50</a>
        <a href="https://raw13g.github.io" class="btn">⚡ تهكير نظام 13.52</a>
    </div>

</body>
</html>
