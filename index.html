<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقع الألعاب</title>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background-color: #121212;
            color: #ffffff;
            text-align: center;
            margin: 0;
            padding: 50px;
        }
        h1 {
            color: #00ff88;
        }
        .game-banner {
            width: 80%;
            max-width: 600px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            margin: 20px 0;
        }
        .btn {
            display: inline-block;
            background-color: #00ff88;
            color: #121212;
            padding: 12px 25px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 5px;
            margin-top: 20px;
            transition: 0.3s;
        }
        .btn:hover {
            background-color: #00cc6a;
        }
    </style>
</head>
<body>

    <h1>مرحباً بك في موقع الألعاب الخاص بي</h1>
    <p>هنا تظهر صورة اللعبة أو الغلاف الجديد:</p>

    <!-- عرض الصورة في المنتصف باسمها الصحيح -->
    <img src="background.jpg" alt="صورة اللعبة" class="game-banner">

    <div>
        <br>
        <a href="#" class="btn">ابدأ اللعب الآن</a>
    </div>

</body>
</html>
