<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PS4 Jailbreak & Tools</title>
    <style>
        /* إعدادات الخلفية لتغطي الشاشة بالكامل */
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background-image: url('background.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            font-family: Tahoma, sans-serif;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            /* طبقة شفافة داكنة لليضاح فوق الخلفية */
            background-color: rgba(0, 0, 0, 0.6);
            background-blend-mode: darken;
        }

        h1 {
            font-size: 2.5rem;
            color: #00ff88;
            margin-bottom: 10px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
        }

        p {
            font-size: 1.2rem;
            margin-bottom: 30px;
            color: #dddddd;
        }

        /* تنسيق الأزرار */
        .btn-container {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            background-color: #00ff88;
            color: #121212;
            padding: 12px 30px;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.1rem;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
            transition: 0.3s ease;
        }

        .btn:hover {
            background-color: #00cc6a;
            transform: translateY(-3px);
        }
    </style>
</head>
<body>

    <h1>PS4 Pages & Tools</h1>

    <!-- الأزرار التفاعلية -->
    <div class="btn-container">

</html>
