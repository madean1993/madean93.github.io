<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقع الألعاب</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            /* ربط الصورة كخلفية للشاشة بالكامل */
            background-image: url('background.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            font-family: Tahoma, sans-serif;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            /* طبقة شفافة داكنة فوق الخلفية لتوضيح النصوص والأزرار */
            background-color: rgba(0, 0, 0, 0.6);
            background-blend-mode: darken;
        }

        h1 {
            color: #00ff88;
            font-size: 2.5rem;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
            margin-bottom: 10px;
        }

        p {
            font-size: 1.2rem;
            color: #dddddd;
            margin-bottom: 30px;
        }

        .btn {
            display: inline-block;
            background-color: #00ff88;
            color: #121212;
            padding: 12px 30px;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.1rem;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
            transition: 0.3s;
        }

        .btn:hover {
            background-color: #00cc6a;
            transform: translateY(-3px);
        }
    </style>
</head>
<body>

    <h1>مرحباً بك في موقع الألعاب الخاص بي</h1>
    <p>تم تحميل الخلفية بنجاح وتغطي الشاشة بالكامل</p>

    <div>
        <a href="#" class="btn">ابدأ اللعب الآن</a>
    </div>

</body>
</html>
